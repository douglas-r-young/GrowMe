[project]
name = "growme"
version = "0.1.0"
description = "Behavior-change training programs from a single intake."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "langgraph>=0.2.55",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "litellm>=1.55",
    "apify-client>=1.7",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
